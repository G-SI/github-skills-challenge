name: Python Coverage

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

env:
  PYTHONPATH: .

jobs:
  python-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies and coverage tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install coverage==7.9 pytest-cov==6.2.1

      - name: Run tests and generate coverage details
        run: pytest -v -ra --cov=src --cov-report=term-missing

      - name: Publish coverage comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 50
          MINIMUM_ORANGE: 70

      - name: Fail if coverage is below 50 percent
        run: coverage report --fail-under=50
